name: MaceSpell
version: 1.0.0
main: com.enderdevelopment.plugin.Main
api-version: "1.21"
commands:
  macespell:
    description: Gives you the enchanted spell mace.
    usage: /macespell
    permission: macespell.use
permissions:
  macespell.use:
    description: Allows the player to receive the spell mace.
    default: op
